<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <title>Van Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="assets/css/cadastro.css" rel="stylesheet" media="all">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md">
        <div class="container-fluid">
          <img src="assets/img/logo.png" alt="Logomarca Vans Connect" width="60px" height="60px">
        </div>
      </nav>
    </header>
    <main>
      <!-- Cadastro de Usuários -->
      <div class="container-fluid cadastroUsuario" id="grad1">
          <div class="row justify-content-center mt-0">
              <div class="col-11 col-sm-9 col-md-7 col-lg-6 text-center p-0 mt-3 mb-2">
                  <div class="card px-0 pt-4 pb-0 mt-3 mb-3">
                      <div class="row">
                          <div class="col-md-12 mx-0">
                              <form id="msform">
                                  <!-- progressbar -->
                                  <ul id="progressbar">
                                      <li class="active" id="acesso_icone"><strong>Acesso</strong></li>
                                      <li id="pessoal_icone"><strong>Pessoal</strong></li>
                                      <li id="endereco_icone"><strong>Endereço</strong></li>
                                      <li id="dependente_icone"><strong>Dependente</strong></li>
                                      <li id="confirm_icone"><strong>Finish</strong></li>
                                  </ul>
                                  <!-- fieldsets -->
                                  <fieldset>
                                      <div class="form-card">
                                          <h2 class="fs-title">Acesso</h2>
                                          <input type="email" name="email_CadastroAdmin" id="email_CadastroAdmin" placeholder="*  Email..."/>
                                          <span class="msgErro" id="msgErro_email_CadastroAdmin"></span>
                                          <input type="password" name="senha_CadastroAdmin" id="senha_CadastroAdmin" placeholder="*  Senha..."/>
                                          <span class="msgErro" id="msgErro_senha_CadastroAdmin"></span>
                                          <input type="password" name="confirmarsenha_CadastroAdmin" id="confirmarsenha_CadastroAdmin" placeholder="*  Confirmar Senha..."/>
                                          <span class="msgErro" id="msgErro_confirmarsenha_CadastroAdmin"></span>
                                      </div>
                                      <input type="button" name="next" class="next action-button" id="ProximoAdmin1" value="Próxima"/>
                                  </fieldset>
                                  <fieldset>
                                      <div class="form-card">
                                          <h2 class="fs-title">Pessoal</h2>
                                          <input type="text" name="cpf_CadastroAdmin" id="cpf_CadastroAdmin" placeholder="*  CPF" mask="###.###.###-88" />
                                          <span class="msgErro" id="msgErro_cpf_CadastroAdmin"></span>
                                          <input type="text" name="nome_CadastroAdmin" id="nome_CadastroAdmin" placeholder="*  Nome Completo"/>
                                          <span class="msgErro" id="msgErro_nome_CadastroAdmin"></span>
                                          <div class="row">
                                            <div class="col-7">
                                              <label for="nascimento_CadastroAdmin">&nbsp&nbsp* &nbspNascimento</label>
                                              <input type="date" name="nascimento_CadastroAdmin" id="nascimento_CadastroAdmin"/>
                                              <span class="msgErro" id="msgErro_nascimento_CadastroAdmin"></span>
                                            </div>
                                            <div class="col-5">
                                              <label for="telefone_CadastroAdmin">&nbsp</label>
                                              <input type="text" name="telefone_CadastroAdmin" id="telefone_CadastroAdmin" placeholder="*  Contato"/>
                                              <span class="msgErro" id="msgErro_telefone_CadastroAdmin"></span>
                                            </div>
                                            
                                          </div>
                                      </div>
                                      <input type="button" name="previous" class="previous action-button-previous" value="Anterior"/>
                                      <input type="button" name="next" class="next action-button" id="ProximoAdmin2" value="Próxima"/>

                                  </fieldset>
                                  <fieldset>
                                      <div class="form-card">
                                          <h2 class="fs-title">Endereço</h2>
                                          <div class="row">
                                          <div class="col-4">
                                            <input type="text" name="cep_CadastroAdmin" id="cep_CadastroAdmin" placeholder="*  CEP"/>
                                            <span class="msgErro" id="msgErro_cep_CadastroAdmin"></span>
                                          </div>
                                          <div class="col-8">
                                            <input type="text" name="logradouro_CadastroAdmin" id="logradouro_CadastroAdmin" placeholder="*  Logradouro"/>
                                            <span class="msgErro" id="msgErro_logradouro_CadastroAdmin"></span>
                                          </div>
                                          </div>
                                          <div class="row">
                                          <div class="col-4">
                                            <input type="number" name="numero_CadastroAdmin" id="numero_CadastroAdmin" placeholder="*  Número"/>
                                            <span class="msgErro" id="msgErro_numero_CadastroAdmin"></span>
                                          </div>
                                          <div class="col-8">
                                            <input type="text" name="complemento_CadastroAdmin" id="complemento_CadastroAdmin" placeholder="*  Complemento"/>
                                            <span class="msgErro" id="msgErro_complemento_CadastroAdmin"></span>
                                          </div>
                                          </div>
                                          <div class="row">
                                          <div class="col-4">
                                            <input type="text" name="bairro_CadastroAdmin" id="bairro_CadastroAdmin" placeholder="*  Bairro"/>
                                            <span class="msgErro" id="msgErro_bairro_CadastroAdmin"></span>
                                          </div>
                                          <div class="col-8">
                                            <input type="text" name="cidade_CadastroAdmin" id="cidade_CadastroAdmin" placeholder="*  Cidade"/>
                                            <span class="msgErro" id="msgErro_cidade_CadastroAdmin"></span>
                                          </div>
                                          </div>                                    
                                      </div>
                                      <input type="button" name="previous" class="previous action-button-previous" value="Anterior"/>
                                      <input type="button" name="next" class="next action-button" id="ProximoAdmin3" value="Próxima"/>
                                  </fieldset>
                                  <fieldset>
                                      <div class="form-card">
                                          <h2 class="fs-title">Cargo</h2>
                                          <input type="text" name="cargo_CadastroAdmin" id="cargo_CadastroAdmin" placeholder="Cargo"/>
                                          <span class="msgErro" id="msgErro_cargo_CadastroAdmin"></span>
                                      </div>
                                      <input type="button" name="previous" class="previous action-button-previous" value="Anterior"/>
                                      <input type="button" name="CadastrarAdmin" class="next action-button" id="CadastrarAdmin" onclick="cadastrar_Admin()" value="Cadastrar"/>
                                  </fieldset>
                                  <fieldset>
                                      <div class="form-card">
                                          <h2 class="fs-title text-center">Sucesso</h2>
                                          <br><br>
                                          <div class="row justify-content-center">
                                              <div class="col-3">
                                                  <img src="https://img.icons8.com/color/96/000000/ok--v2.png" class="fit-image">
                                              </div>
                                          </div>
                                          <br><br>
                                          <div class="row justify-content-center">
                                              <div class="col-7 text-center">
                                                  <h5>Seu cadastro está completo!</h5>
                                              </div>
                                          </div>
                                      </div>
                                  </fieldset>
                              </form>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </main>
    <footer id="rodapeCadastro">
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
            <center>
              <p style="font-size: 13px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
            </center>
          </div>
        </div>
      </div>
    </footer>


    <script src="assets/js/dados_cadastro.js"></script>
    <script src="assets/js/cadastro.js"></script>
    <script src="assets/js/validarCamposCadastro.js"></script>
    <script src="assets/vendor/jquery/jquery.mask.js"></script>
  </body>
</html>
