<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Vans Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/pesquisaMotorista.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        .card-img-top {
            height: 80%; 
            object-fit: cover; 
        }
        #user-list{
          display: grid;
          grid-template-columns: repeat(3, 1fr);
        }
    </style>
</head>
<body>
<header>
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid" id="">
      <img src="assets/img/logo.png" alt="Logomarca Vans Connect" width="60px" height="60px">
      <div id="Menu" style="text-align: right;">
          
      </div>
    </div>
  </nav>
</header>
<div class="header">
    <button style="text-align: left;" id="VerListaDrivers" onclick="paginaListaMotoristasAdmin()">Ver Lista de Motoristas</button>
    <img src="assets/img/logo.png" alt="logo" width="100" height="auto">
    <input type="text" id="searchInput" placeholder="Digite sua pesquisa...">
    <button id="searchButton">
        <i class="fas fa-search" style="color: #eeeeee;"></i> 
    </button>
    
</div>
<div class="wrapper">
    <div class="container mt-5" id="user-list">
        <!-- <div class="row" >
            Card dinâmico de motoristas
        </div> -->
    </div>
</div>
<footer>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                <center>
                    <p style="font-size: 15px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
                </center>
            </div>
        </div>
    </div>
</footer>

<script>
    // Recuperar dados do localStorage
    const listaUser = JSON.parse(localStorage.getItem('listaUser')) || [];

    // Função para obter o valor de um parâmetro da URL
    function getParameterByName(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    // Obter o ID do user da URL
    const userId = getParameterByName('id'); 

    function createMuralAvisosMotorista(){
        return '<a id="MuralAvisosMotorista" style="text-align: right;" href="muralAvisosMotorista.html?id='+driverId+'"><i style="font-size: 30px; color: black;" class="fa fa-book" aria-hidden="true">&nbsp&nbsp&nbsp</i></a>';
    }

    function renderMuralAvisosMotorista() {
        const Menu = document.getElementById('Menu');
        Menu.innerHTML += createMuralAvisosMotorista();
    }

    // Função para criar os cards
    function createUserCard(user) {
        return `
            <div class="col-md-11">
                <a href="detalhesUsuario_Admin.html?id=${user.idCad}" class="text-decoration-none text-dark">
                    <div class="card mb-4">
                        <div class="card-body">
                            <img src="assets/img/usuarios.png" class="img-fluid card-img-top" alt="Motoristas">
                            <h5 class="card-title">ID: ${user.idCad}</h5>
                            <p class="card-text">Nome: ${user.nomeCad}</p>
                            <p class="card-text">Email: ${user.emailCad}</p>
                            <p class="card-text">Telefone: ${user.telefoneCad}</p>
                            <p class="card-text">Bairro: ${user.bairroCad}</p>
                        </div>
                    </div>
                </a>
            </div>
        `;
    }

    function paginaListaMotoristasAdmin(){
        window.location.href = "listaMotoristas_Admin.html?id=" + userId;
    }

    // Função para renderizar os cards
    function renderUserCards(filteredUsers = listaUser) {
        const userListElement = document.getElementById('user-list');
        userListElement.innerHTML = '';
        filteredUsers.forEach(user => {
            userListElement.insertAdjacentHTML('beforeend', createUserCard(user));
        });
    }

    // Função de busca
    function search() {
        const searchInput = document.getElementById('searchInput').value.toLowerCase();
        const filteredUsers = listaUser.filter(user => {
            return user.nomeCad.toLowerCase().includes(searchInput) ||
                   user.emailCad.toLowerCase().includes(searchInput) ||
                   user.telefoneCad.toLowerCase().includes(searchInput) ||
                   user.bairroCad.toLowerCase().includes(searchInput) ;
        });
        renderUserCards(filteredUsers);
    }

    // Adicionar evento de clique ao botão de busca
    document.getElementById('searchButton').addEventListener('click', search);

    renderUserCards();
    renderMuralAvisosMotorista();
</script>

</body>
</html>
