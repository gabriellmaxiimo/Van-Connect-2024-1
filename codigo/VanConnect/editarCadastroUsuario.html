<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cadastro Usuário</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/editarusuario.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <img src="assets/img/logo.png" alt="Logomarca Vans Connect" width="60px" height="60px">
            </div>
        </nav>
    </header>

    <div class="container">
        <a id="voltar" style="font-size: 25px;" onclick="Voltar()"><i class="fa fa-arrow-left" aria-hidden="true"></i></a>
        <h1 class="mt-5">Atualizar Usuário</h1>
        <form id="updateUserForm">
            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" class="form-control" id="cep" required>
            </div>
            <div class="form-group">
                <label for="logradouro">Logradouro</label>
                <input type="text" class="form-control" id="logradouro" required>
            </div>
            <div class="form-group">
                <label for="numero">Número</label>
                <input type="text" class="form-control" id="numero" required>
            </div>
            <div class="form-group">
                <label for="complemento">Complemento</label>
                <input type="text" class="form-control" id="complemento" required>
            </div>
            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" class="form-control" id="bairro" required>
            </div>
            <div class="form-group">
                <label for="cidade">Cidade</label>
                <input type="text" class="form-control" id="cidade" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" class="form-control" id="telefone" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-warning">Atualizar</button>
        </form>
    </div>

    <footer>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <center>
                        <p style="font-size: 13px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
                    </center>
                </div>
            </div>
        </div>
    </footer>

<script>

    function Voltar(){
      window.history.back();
    }

    // Função para obter o valor de um parâmetro da URL
        function getParameterByName(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Obter o ID do user da URL e converter para número
        const userId = Number(getParameterByName('id'));

        // Recuperar dados do localStorage
        const listaUser = JSON.parse(localStorage.getItem('listaUser')) || [];

        // Evento de Envio do Formulário
        document.getElementById('updateUserForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Obter os valores do formulário
            const cep = document.getElementById('cep').value;
            const logradouro = document.getElementById('logradouro').value;
            const numero = document.getElementById('numero').value;
            const complemento = document.getElementById('complemento').value;
            const bairro = document.getElementById('bairro').value;
            const cidade = document.getElementById('cidade').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const senha = document.getElementById('senha').value;

            // Encontrar o user pelo ID
            const userIndex = listaUser.findIndex(user => user.idCad === userId);

            // Atualizar as informações do motorista encontrado
            if (userIndex !== -1) {
                listaUser[userIndex].cepCad = cep;
                listaUser[userIndex].logradouroCad = logradouro;
                listaUser[userIndex].numeroCad = numero;
                listaUser[userIndex].complementoCad = complemento;
                listaUser[userIndex].bairroCad = bairro;
                listaUser[userIndex].cidadeCad = cidade;
                listaUser[userIndex].emailCad = email;
                listaUser[userIndex].telefoneCad = telefone;
                listaUser[userIndex].senhaCad = senha;
                listaUser[userIndex].confirmarSenhaCad = senha;

                // Salvar de volta no localStorage
                localStorage.setItem('listaUser', JSON.stringify(listaUser));

                // Informar o usuário que a atualização foi bem-sucedida
                alert('Informações atualizadas com sucesso!');
            } else {
                alert('Usuário não encontrado.');
            }
        });
</script>
</body>

</html>
