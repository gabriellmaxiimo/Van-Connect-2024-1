<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cadastro Usuário</title>
    <link rel="stylesheet" href="../assets/css/editarusuario.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <img src="assets/img/logo.png" alt="Logomarca Vans Connect" width="60px" height="60px">
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Editar Cadastro do Usuário</h1>

        <form id="form-cadastro">
            <h2>Informações Pessoais</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco">

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone">

            <label for="birthday">Data de Nascimento:</label>
            <input type="date" id="birthday" name="birthday">
            
            <h2>Formas de Pagamento</h2>
            <label for="cartao-numero">Número do Cartão:</label>
            <input type="text" id="cartao-numero" name="cartao-numero" placeholder="XXXX-XXXX-XXXX-XXXX" required>

            <label for="cartao-validade">Data de Validade:</label>
            <input type="text" id="cartao-validade" name="cartao-validade" placeholder="MM/AA" required>

            <label for="cartao-cvc">CVC:</label>
            <input type="text" id="cartao-cvc" name="cartao-cvc" required>

            <button type="submit">Salvar Informações</button>
        </form>

        <button id="botao-principal" onclick="window.location.href='homepage.html'">Voltar à Página Principal</button>
        <p id="message"></p>
    </div>

    <footer>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <center>
                        <p style="font-size: 13px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
                    </center>
                </div>
            </div>
        </div>
    </footer>

    <script src="../assets/js/editarusuario.js"></script>
</body>

</html>
