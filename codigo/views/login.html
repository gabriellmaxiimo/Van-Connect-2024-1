<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <title>Van Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/dados_cadastro.js"></script>
    <script src="assets/js/login.js"></script>
  </head>
  <body onload="getcookiedata()">
    <header>
      <nav class="navbar navbar-expand-md">
        <div class="container-fluid">
          <img src="assets/img/logo.png" alt="Logomarca Vans Connect" width="60px" height="60px">
        </div>
      </nav>
    </header>
    <main>
      <div class="container h-100">
        <div class="d-flex justify-content-center h-100">
          <div class="user_card">
            <div class="d-flex justify-content-center">
            </div>
            <div class="d-flex justify-content-center form_container">
              <form>
                <div id="msgErro"></div>
                <div class="input-group mb-3">
                  <div class="input-group-append">
                    <span class="input-group-text" id="iconeUser"><i class="fa fa-user"></i></span>
                  </div>
                  <input type="text" name="emailLogin" id="emailLogin" class="form-control input_user" value="" placeholder="digite seu email...">
                  <span id="emailErro"></span>
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text" id="iconeSenha"><i class="fa fa-key"></i></span>
                  </div>
                  <input type="password" name="senhaLogin" id="senhaLogin" class="form-control input_pass" value="" placeholder="digite sua senha...">
                  <i id="iconeVerSenha" class="fa fa-eye" onclick="MostrarSenha()"></i>
                  <br>
                  <span id="senhaErro"></span>
                </div>
                <div class="form-group">
                  <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="customControlInline">
                    <label class="custom-control-label" for="customControlInline">Remember me</label>
                  </div>
                </div>
                  <div class="d-flex justify-content-center mt-3 login_container">
              <button type="button" name="button" class="btn login_btn" id="btn_Login" onclick="logar()">Login</button>
               </div>
              </form>
            </div>
        
            <div class="mt-4">
              <div class="d-flex justify-content-center links">
                Ainda não tem uma conta? &nbsp<a href="cadastro_usuario.html" class="ml-2">Cadastre-se</a>
              </div><br>
              <div class="d-flex justify-content-center links">
                <a href="esqueceuSenha.html">Esqueceu a senha?</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
            <center>
              <p style="font-size: 15px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
            </center>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
