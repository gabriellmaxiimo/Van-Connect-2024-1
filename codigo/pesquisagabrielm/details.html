<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Detalhes do Resultado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/details.css">
</head>
<body>
<div class="header">
    <img src="assets/img/image.png" alt="logo" width="100" height="auto">
</div>
<div class="container">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header" id="detailTitle"></div>
                <button type="button" class="btn-close" aria-label="Close" onclick="goBack()" style="position: absolute; top: 10px; right: 10px;"></button>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p class="card-text" id="detailDescription"></p>
                        </div>
                        <div class="col-md-6">
                            <p class="card-text" id="detailContact"></p>
                            <p class="card-text" id="detailOtherInfo"></p>
                        </div>
                    </div>
                    <img src="" class="card-img-top" id="detailImage" alt="">
                </div>
            </div>
        </div>
    </div>
</div>
<footer>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                <center>
                    <p style="font-size: 15px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
                </center>
            </div>
        </div>
    </div>
</footer>
<script src="data.js"></script>
<script>
    function goBack() {
    window.location.href = "pesquisa.html";
}
    function getParameterByName(name, url) {
        if (!url) url = window.location.href;
        name = name.replace(/[\[\]]/g, "\\$&");
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, " "));
    }

    const resultId = getParameterByName('id');

    const result = data.find(item => item.id === parseInt(resultId));

    document.getElementById("detailTitle").textContent = result.title;
    document.getElementById("detailDescription").textContent = result.description;
    document.getElementById("detailContact").textContent = "Contato: " + result.contact;
    document.getElementById("detailOtherInfo").textContent = "Outras Informações: " + result.otherInfo;
    document.getElementById("detailImage").src = result.imageUrl;
</script>
</body>
</html>
