<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Vans Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/pesquisa.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        .result-card {
            margin: 20px;
            width: calc(33.33% - 40px); 
        }

        @media (max-width: 768px) {
            .result-card {
                width: calc(100% - 40px); 
            }
        }

        .card-img-top {
            height: 80%; 
            object-fit: cover; 
        }
    </style>
</head>
<body>
<div class="header">
    <img src="assets/img/image.png" alt="logo" width="100" height="auto">
    <input type="text" id="searchInput" placeholder="Digite sua pesquisa...">
    <button onclick="search()">
        <i class="fas fa-search" style="color: #eeeeee;"></i> 
    </button>
    
</div>
<div class="wrapper">
    <div class="container-fluid">
        <div class="row" id="resultsContainer">
        </div>
    </div>
</div>
<footer>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                <center>
                    <p style="font-size: 15px;" id="Copyright">Copyright - Todos os direitos reservados a Van Connect</p>
                </center>
            </div>
        </div>
    </div>
</footer>

<script>
    const resultsContainer = document.getElementById("resultsContainer");

    data.forEach(result => {
        const resultCard = document.createElement("div");
        resultCard.classList.add("result-card", "card", "mb-3", "col-md-4", "col-sm-6", "col-xs-12"); 
        resultCard.innerHTML = `
            <div class="card-header">${result.title}</div>
            <div class="card-body">
                <p class="card-text">${result.description}</p>
                <img src="${result.imageUrl}" class="card-img-top" alt="${result.title}">
            </div>`;
        resultCard.addEventListener("click", () => {
            window.location.href = `details.html?id=${result.id}`;
        });
        resultsContainer.appendChild(resultCard);
    });

</script>
<script src="data.js"> </script>
<script src="script.js"> </script>
</body>
</html>
